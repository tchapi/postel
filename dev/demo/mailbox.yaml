# A small, believable mailbox for screenshots and demos, loaded with
#   php bin/console app:dev:seed-demo
#
# Dates are relative to the moment the seed runs ("-35 minutes", "yesterday 21:47"),
# so the list always shows Today and Yesterday. Folders use "/" for nesting.
# A message with `id` can be answered by another one with `reply_to`: they then
# share a conversation.

me: [Camille Martin, camille@example.test]

people:
  lea: [Léa Moreau, lea.moreau@example.test]
  jonas: [Jonas Weber, jonas@northstudio.example]
  aicha: [Aïcha Diallo, aicha@northstudio.example]
  sam: [Sam Okafor, sam.okafor@example.test]
  nina: [Nina Martin, nina.martin@example.test]
  mum: [Isabelle Martin, isabelle.martin@example.test]
  dad: [Pierre Martin, pierre.martin@example.test]
  marc: [Marc Dubois, marc.dubois@example.test]
  clinic: [Dr Anaïs Leroy, rdv@cabinet-leroy.example]
  building: [Résidence Les Tilleuls, gestion@lestilleuls.example]
  rail: [Rail Express, tickets@rail-express.example]
  kettle: [The Weekly Kettle, hello@weeklykettle.example]
  books: [Atelier Papier, orders@atelierpapier.example]
  forge: [Forgeline, notifications@forgeline.example]
  energy: [Lumen Energy, billing@lumen-energy.example]
  gym: [Bloc Up Climbing, hello@blocup.example]
  hotel: [Hotel Alfama, reservations@hotelalfama.example]
  airline: [Azul Air, checkin@azulair.example]
  hr: [North Studio People, people@northstudio.example]
  lottery: [Prize Department, winner@lucky-cruise.example]

folders: [Archive, Family, Work, Work/Website, Receipts, Travel]

messages:

  # ---- Inbox ----

  - folder: INBOX
    id: dinner
    from: lea
    subject: Dinner on Friday?
    when: -2 days 18:10
    text: |
      Hi Camille!

      It's been ages. Are you free on Friday evening? I'd love to try the new place near Les Halles, they say the fish is wonderful.

      Let me know, I can book a table.

      Léa

  - folder: INBOX
    reply_to: dinner
    from: lea
    subject: "Re: Dinner on Friday?"
    when: -35 minutes
    seen: false
    attachments: [menu.pdf]
    text: |
      Perfect! I booked a table for 8pm, under my name. Here is the menu, the dessert list alone is worth the trip.

      See you Friday!
      Léa

  - folder: INBOX
    id: mockups
    from: jonas
    to: [me, aicha]
    subject: "Website redesign: first mockups"
    when: -1 day 10:05
    flagged: true
    attachments: [mockups-v1.pdf]
    text: |
      Hi Camille,

      Here are the first mockups for the new website: the home page, the project page and the contact form.

      I went with the lighter navigation we talked about. Tell me what you think before Wednesday's review, I'd like to start on the mobile versions next week.

      Thanks,
      Jonas

  - folder: INBOX
    reply_to: mockups-reply
    from: jonas
    to: [me, aicha]
    subject: "Re: Website redesign: first mockups"
    when: -3 hours
    seen: false
    attachments: [homepage-v2.png]
    text: |
      Good points, thanks. I moved the contact button up and gave the photos more room. Updated home page attached.

      Jonas

  - folder: INBOX
    from: sam
    subject: Climbing on Sunday?
    when: -5 hours
    seen: false
    text: |
      Hey! A few of us are going to the climbing gym on Sunday around 10. The new routes went up on Thursday.

      Want to join? I can bring the spare harness.

      Sam

  - folder: INBOX
    from: kettle
    subject: Five soups for the first cold days
    when: -7 hours
    html: |
      <div style="max-width:560px;margin:0 auto;font-family:Georgia,serif;color:#2d2a26">
        <img src="https://images.weeklykettle.example/header.jpg" alt="The Weekly Kettle" width="560" style="display:block;width:100%">
        <h1 style="font-size:26px;margin:24px 0 8px">Five soups for the first cold days</h1>
        <p style="font-size:16px;line-height:1.6">The evenings are getting shorter and the market stalls are full of squash. This week, five soups that take less than forty minutes, from a smoky pumpkin to a green pea and mint.</p>
        <img src="https://images.weeklykettle.example/pumpkin-soup.jpg" alt="Pumpkin soup" width="560" style="display:block;width:100%;border-radius:8px">
        <h2 style="font-size:20px;margin:24px 0 8px">1. Smoky pumpkin and paprika</h2>
        <p style="font-size:16px;line-height:1.6">Roast the pumpkin with garlic and smoked paprika, then blend it with a little stock and a spoon of crème fraîche.</p>
        <p style="font-size:16px;line-height:1.6"><a href="https://weeklykettle.example/soups" style="color:#b5502f">Read the five recipes</a></p>
        <p style="font-size:12px;color:#8a847d;margin-top:32px">You receive this because you subscribed to The Weekly Kettle. <a href="https://weeklykettle.example/unsubscribe" style="color:#8a847d">Unsubscribe</a></p>
      </div>

  - folder: INBOX
    from: rail
    subject: "Your tickets: Lyon → Paris, Thursday 14 November"
