# The webmail as it runs for real: the production image behind Traefik and
# Authelia forward-auth, on top of the dev mail server and Davis (start those
# first, see README.md).
#
#   docker compose -f dev/stack/compose.yaml up -d --build
#
# Then https://mail.localtest.me:8443 (a self-signed certificate, accept it)
# and log in as alice / alice-password. localtest.me resolves to 127.0.0.1.
# Contacts need DAVIS_APP_ID and DAVIS_APP_SECRET in the environment.
name: webmail-stack

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=webmail-stack_front
      - --entrypoints.websecure.address=:443
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      front:
        # Pinned so the webmail can trust this proxy alone
        ipv4_address: 172.31.250.2

  authelia:
    image: authelia/authelia:4.39
    volumes:
      - ./authelia:/config:ro
      - authelia_data:/data
    networks:
      - front
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`auth.localtest.me`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.routers.authelia.tls=true
      - traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.localtest.me%3A8443
      - traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email

  webmail:
    build: ../..
    environment:
      APP_SECRET: dev-only-app-secret
      TRUSTED_PROXIES: 172.31.250.2
      IMAP_HOST: host.docker.internal
      IMAP_PORT: 1143
      IMAP_MASTER_PASSWORD: master-password
      SMTP_HOST: host.docker.internal
      SMTP_PORT: 1587
      SMTP_ENCRYPTION: "false"
      DAVIS_URL: http://host.docker.internal:9000/dav/
      DAVIS_APP_ID: ${DAVIS_APP_ID:-}
      DAVIS_APP_SECRET: ${DAVIS_APP_SECRET:-}
      LOGOUT_URL: https://auth.localtest.me:8443/logout
    volumes:
      - webmail_data:/app/var/data
    networks:
      - front
    labels:
      - traefik.enable=true
      - traefik.http.routers.webmail.rule=Host(`mail.localtest.me`)
      - traefik.http.routers.webmail.entrypoints=websecure
      - traefik.http.routers.webmail.tls=true
      - traefik.http.routers.webmail.middlewares=authelia@docker
      - traefik.http.services.webmail.loadbalancer.server.port=8080

networks:
  front:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          # Other containers take addresses up there, away from Traefik's
          ip_range: 172.31.250.128/25

volumes:
  authelia_data:
  webmail_data:
