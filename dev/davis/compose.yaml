# A throwaway Davis (CardDAV/CalDAV) server for local development.
#
#   docker compose -f dev/davis/compose.yaml up -d
#   docker exec -u www-data postel-dev-davis sh -c 'cd /var/www/davis && APP_ENV=prod bin/console doctrine:migrations:migrate --no-interaction'
#
# Admin: admin / admin-password at http://127.0.0.1:9000
# CardDAV user: alice / alice-password, see dev/davis/seed.sh
# Postel's app key: see README.md
services:
  davis:
    image: ghcr.io/tchapi/davis-standalone:5.6.1
    container_name: postel-dev-davis
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      APP_ENV: prod
      APP_SECRET: not-a-secret-dev-only
      DATABASE_DRIVER: sqlite
      DATABASE_URL: sqlite:////var/www/davis/var/data.db
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin-password
      AUTH_METHOD: Basic
      AUTH_REALM: davis-dev
      CALDAV_ENABLED: "true"
      CARDDAV_ENABLED: "true"
      WEBDAV_ENABLED: "false"
      APP_KEYS_ENABLED: "true"
      MAILER_DSN: null://null
