# A sample setup for Postel, with the variables in a .env file next to
# this one. See README.md for each of them.
#
# Postel must only be reachable through your reverse proxy: put it on
# the proxy's network, and don't publish its port.
services:
  postel:
    image: ghcr.io/tchapi/postel:1
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?set a random string}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set the address of your reverse proxy}
      IMAP_HOST: ${IMAP_HOST:-mail}
      IMAP_PORT: ${IMAP_PORT:-143}
      IMAP_ENCRYPTION: ${IMAP_ENCRYPTION:-tls}
      IMAP_MASTER_USER: ${IMAP_MASTER_USER:-webmail}
      IMAP_MASTER_PASSWORD: ${IMAP_MASTER_PASSWORD:?set the Dovecot master password}
      IMAP_LOGIN_ATTRIBUTE: ${IMAP_LOGIN_ATTRIBUTE:-email}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      DAVIS_URL: ${DAVIS_URL:-}
      DAVIS_APP_ID: ${DAVIS_APP_ID:-}
      DAVIS_APP_SECRET: ${DAVIS_APP_SECRET:-}
      LOGOUT_URL: ${LOGOUT_URL:-}
    volumes:
      - postel_data:/app/var/data

volumes:
  postel_data:
