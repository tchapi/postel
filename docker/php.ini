; Production settings for the Postel container.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = UTC

; Mails with big attachments go through here, keep in sync with the Caddyfile.
memory_limit = 256M
post_max_size = 50M
upload_max_filesize = 50M
max_input_vars = 1000

; Not needed and the validated FPM path of CVE-2026-109619.
session.upload_progress.enabled = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
